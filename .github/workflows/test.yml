name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_URL: postgresql+asyncpg://postgres:testpassword@localhost:5432/booking_dev
      TEST_DB_URL: postgresql+asyncpg://postgres:testpassword@localhost:5432/booking_test
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_URL: redis://localhost:6379
      MAIL_USERNAME: test@test.com
      MAIL_PASSWORD: testpassword
      MAIL_FROM: noreply@test.com
      MAIL_PORT: "587"
      MAIL_SERVER: smtp.gmail.com
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"
      JWT_SECRET_ACCESS_KEY: ci-access-secret
      JWT_SECRET_REFRESH_KEY: ci-refresh-secret
      JWT_ALGORITHM: HS256
      GOOGLE_CLIENT_ID: ci-google-id
      GOOGLE_CLIENT_SECRET: ci-google-secret
      GOOGLE_REDIRECT_URI: http://localhost:8000/api/v1/auth/google/callback
      OMDB_API_KEY: ci-omdb-key
      ES_URL: http://localhost:9200
      ENCRYPTION_PASSWORD: ci-encryption-password
      ENCRYPTION_STATIC_SALT: ci-static-salt
      ENV: TESTING
      CORS_ORIGINS: "*"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --frozen

      - name: Create test databases
        run: |
          PGPASSWORD=testpassword psql -h localhost -U postgres -c "CREATE DATABASE booking_dev;" || true
          PGPASSWORD=testpassword psql -h localhost -U postgres -c "CREATE DATABASE booking_test;" || true

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short
