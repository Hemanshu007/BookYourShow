name: online-ticket-booking-system

services:
  api:
    build: .
    entrypoint : ["sh","/online-ticket-booking-system/entrypoint.sh"]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    container_name: fastapi_app_container
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    restart: always
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./app
          target: /online-ticket-booking-system/app
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./uv.lock

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    container_name: frontend_container
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: always

  db:
    image: postgres:16-alpine
    ports:
      - "5431:5432"
    container_name: postgres_container
    env_file:
      - .env.docker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:alpine
    container_name: redis_container
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  elasticsearch:
    image: elasticsearch:9.2.7
    container_name: elasticsearch_container
    environment:
      - xpack.security.enabled=false
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    env_file:
      - .env.docker
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  elastic_data: